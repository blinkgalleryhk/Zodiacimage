    var reason = event.reason;
    if (reason instanceof Event || (reason && reason.isTrusted === true && typeof reason.type === 'string')) {
      event.preventDefault();
      event.stopImmediatePropagation();
      console.warn('Ignored unhandled promise rejection with Event object:', reason);
    }
  }, true);</script><style>#inpage-console {
    position: fixed;

    bottom: 0;
    max-height: 35vh;

  #inpage-console-buttons {

  }
  #inpage-console button:hover {
    background: rgba(255,255,255,0.16);
  }
  #inpage-console-messages {
    flex: 1;
    overflow-y: auto;
    padding: 8px 10px 10px;
    font-size: 12px;

  }
  #inpage-console-messages div {

  }
  #inpage-console-messages .console-log {
    color: #dcdcdc;
  }
  #inpage-console-messages .console-warn {
    color: #f0c674;
  }
  #inpage-console-messages .console-error {
    color: #ff6c6b;
  }
  #inpage-console-messages .console-info {
    color: #8abeb7;
  }
  #inpage-console-messages .console-debug {
    color: #81a2be;
  }
  #inpage-console-messages .console-collapsed {
    display: none;
  }</style><div id="inpage-console" class="collapsed" aria-live="polite"><div id="inpage-console-header"><div id="inpage-console-title">Debug Console</div><div id="inpage-console-buttons"><button id="inpage-console-toggle" type="button">Show</button> <button id="inpage-console-clear" type="button">Clear</button></div></div><div id="inpage-console-messages" aria-label="Console messages"></div></div><script>;(function () {
    const createMessage = (level, args) => {
      const message = document.createElement('div')
      message.className = `console-${level}`
      const items = args.map((item) => {
        if (typeof item === 'object' && item !== null) {
          try {
            return JSON.stringify(item, null, 2)
          } catch (e) {
            return String(item)
          }
        }
        return String(item)
      })
      message.textContent = items.join(' ')
      return message
    }

    const consoleBox = document.getElementById('inpage-console')
    const messages = document.getElementById('inpage-console-messages')
    const toggleButton = document.getElementById('inpage-console-toggle')
    const clearButton = document.getElementById('inpage-console-clear')

    const append = (level, args) => {
      if (!messages) return
      const entry = createMessage(level, args)
      messages.appendChild(entry)
      messages.scrollTop = messages.scrollHeight
    }

    const wrapMethod = (methodName, level) => {
      const original = console[methodName]
      console[methodName] = function (...args) {
        append(level, args)
        if (original && typeof original.apply === 'function') {
          original.apply(console, args)
        }
      }
    }

    wrapMethod('log', 'log')
    wrapMethod('info', 'info')
    wrapMethod('warn', 'warn')
    wrapMethod('error', 'error')
    wrapMethod('debug', 'debug')

    window.addEventListener('error', function (event) {
      append('error', [event.message || 'Error', event.filename || '', event.lineno || '', event.colno || ''])
    })

    window.addEventListener('unhandledrejection', function (event) {
      append('warn', ['Unhandled promise rejection:', event.reason])
    })

    if (toggleButton && consoleBox) {
      toggleButton.addEventListener('click', function () {
        const isCollapsed = consoleBox.classList.toggle('collapsed')
        toggleButton.textContent = isCollapsed ? 'Show' : 'Hide'
      })
    }

    if (clearButton && messages) {
      clearButton.addEventListener('click', function () {
        messages.textContent = ''
      })
    }

    console.log('Debug console initialized')
  }())</script><script src="bundle.js"></script></body></html>
